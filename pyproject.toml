[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevre"
version = "0.1.0"
description = "Jev-powered decision layer for Android reverse engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jevre = "jevre.main:entrypoint"

[tool.setuptools.packages.find]
include = ["jevre*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
